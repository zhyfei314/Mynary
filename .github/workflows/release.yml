name: Release Obsidian plugin

on:
    push:
        tags:
            - '*.*.*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run lint
                  npm run build

            - name: Validate release version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version=$(node -p "require('./manifest.json').version")
                  package_version=$(node -p "require('./package.json').version")
                  test "$tag" = "$version"
                  test "$tag" = "$package_version"

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Generate SHA-256 checksums
              run: sha256sum main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }} > SHA256SUMS

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --generate-notes \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }} SHA256SUMS
